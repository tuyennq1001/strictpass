<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Cobalt to Emerald Apple-style diagonal gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="52%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Subtle top highlight sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Shield surface subtle gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8F4FF" />
    </linearGradient>

    <!-- Checkmark vibrant gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="shieldShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#091534" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Apple Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" ry="28" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="116" height="116" rx="28" ry="28" fill="url(#sheenGrad)" />
  <!-- Hairline Inner Border -->
  <rect x="7" y="7" width="114" height="114" rx="27" ry="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="1.5" />

  <!-- Crisp Shield -->
  <path
    d="M64 25 C64 25 46 31.5 34 34.5 C31.8 35 30.5 36.8 30.5 39 L30.5 60 C30.5 80.5 45.2 95.8 61.6 102.3 C63.2 102.9 64.8 102.9 66.4 102.3 C82.8 95.8 97.5 80.5 97.5 60 L97.5 39 C97.5 36.8 96.2 35 94 34.5 C82 31.5 64 25 64 25 Z"
    fill="url(#shieldGrad)"
    filter="url(#shieldShadow)"
  />

  <!-- Crisp Bold Checkmark -->
  <path
    d="M49 64 L59.5 74.5 L80 53"
    fill="none"
    stroke="url(#checkGrad)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
