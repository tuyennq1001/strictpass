<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Cobalt to Emerald Apple-style diagonal gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="52%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Subtle top highlight sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Shield surface subtle gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8F4FF" />
    </linearGradient>

    <!-- Checkmark vibrant gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="shieldShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#091534" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Apple Squircle Base (8px grid-aligned for 16/32/48/128) -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#sheenGrad)" />
  <!-- Hairline Inner Border -->
  <rect x="9" y="9" width="110" height="110" rx="23" ry="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="1.5" />

  <!-- Crisp Shield -->
  <path
    d="M64 26 C64 26 46.5 32.3 35 35.2 C32.8 35.7 31.5 37.5 31.5 39.7 L31.5 60 C31.5 80 45.8 94.8 61.7 101.1 C63.2 101.7 64.8 101.7 66.3 101.1 C82.2 94.8 96.5 80 96.5 60 L96.5 39.7 C96.5 37.5 95.2 35.7 93 35.2 C81.5 32.3 64 26 64 26 Z"
    fill="url(#shieldGrad)"
    filter="url(#shieldShadow)"
  />

  <!-- Crisp Bold Checkmark -->
  <path
    d="M49 64 L59.5 74.5 L80 53"
    fill="none"
    stroke="url(#checkGrad)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
